<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Creative Lab | Digital Alchemy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                50: '#f5f3ff',
                100: '#e0d7ff',
                200: '#c7b0ff',
                300: '#a37cff',
                400: '#8b5cf6', // More vibrant violet
                500: '#54099f', // Main Purple
                600: '#4c068e',
                900: '#0b0147', // Deep Navy
                950: '#03001c', // Darker, richer black-blue
              },
              accent: {
                cyan: '#00d2ff',
                blue: '#0055ff',
                vivid: '#7d00ff'
              }
            },
            transitionTimingFunction: {
              'elegant': 'cubic-bezier(0.16, 1, 0.3, 1)',
            },
            animation: {
              'float': 'float 10s ease-in-out infinite',
              'float-delayed': 'float 12s ease-in-out 5s infinite',
              'blob': 'blob 20s infinite',
              'fade-in': 'fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in-up': 'fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'shimmer': 'shimmer 2.5s linear infinite',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'text-shine': 'textShine 4s linear infinite',
              'spin-slow': 'spin 15s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-20px) rotate(2deg)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(40px, -60px) scale(1.2)' },
                '66%': { transform: 'translate(-30px, 30px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(40px) scale(0.98)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              textShine: {
                '0%': { backgroundPosition: '0% 50%' },
                '100%': { backgroundPosition: '200% 50%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #010105;
        color: #f4f4f5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      
      .noise-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .ambient-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -50;
        background: radial-gradient(circle at center, #03001c 0%, #000 100%);
      }

      .liquid-blob {
        position: absolute;
        filter: blur(140px);
        opacity: 0.5; /* Increased opacity for saturation */
        border-radius: 50%;
        animation: blob 30s infinite alternate ease-in-out;
        will-change: transform;
      }

      .blob-1 { top: -5%; left: -5%; width: 55vw; height: 55vw; background: #0047ff; opacity: 0.35; }
      .blob-2 { bottom: -5%; right: -5%; width: 65vw; height: 65vw; background: #7d00ff; opacity: 0.3; }
      .blob-3 { top: 30%; right: 20%; width: 35vw; height: 35vw; background: #00d2ff; opacity: 0.15; }

      .mac-glass {
        background: rgba(11, 1, 71, 0.3);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }
      
      .ultra-glass {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
        backdrop-filter: blur(50px);
        -webkit-backdrop-filter: blur(50px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 0 20px rgba(84, 9, 159, 0.1);
      }

      .ultra-glass:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        border-color: rgba(255, 255, 255, 0.3);
        box-shadow: 
          0 40px 80px -15px rgba(0, 0, 0, 0.8),
          0 0 40px rgba(0, 163, 255, 0.25);
        transform: translateY(-6px);
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #010105; }
      ::-webkit-scrollbar-thumb { background: #54099f; border-radius: 10px; }
      
      ::selection {
        background: #00d2ff;
        color: black;
      }
      
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div class="noise-overlay"></div>
    <div class="ambient-background">
      <div class="liquid-blob blob-1"></div>
      <div class="liquid-blob blob-2"></div>
      <div class="liquid-blob blob-3"></div>
    </div>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
